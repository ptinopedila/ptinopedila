# image will be published to ghcr.io/<user>/<name>
name: ptinopedila-home-nvidia
# description will be included in the image's metadata
description: "A Bluefin-based workstation for economists and data scientists, with NVIDIA support."

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/projectbluefin/bluefin-nvidia
image-version: stable

# list of modules, executed in order
modules:
  - from-file: common_modules/bluefin-rename-dconf.yml
  - from-file: common_modules/workstation.yml
  - from-file: common_modules/secureblue.yml
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
