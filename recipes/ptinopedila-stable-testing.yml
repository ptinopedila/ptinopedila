# Temporary canary for the Project Bluefin stable stream.
# This build will start succeeding once stable includes brew-preinstall.
name: ptinopedila-home-stable-testing
description: "Temporary canary for Bluefin stable compatibility."

base-image: ghcr.io/projectbluefin/bluefin
image-version: stable

modules:
  - from-file: common_modules/bluefin-rename-dconf.yml
  - from-file: common_modules/workstation.yml
  - from-file: common_modules/secureblue.yml
  - from-file: common_modules/cleanup.yml
  - type: signing
