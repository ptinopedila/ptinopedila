# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Check the upstream base before any package or configuration changes.
  - type: script
    scripts:
      - assert-inherited-packages.sh
      - assert-inherited-squashfs-tools.sh

  - type: script
    no-cache: true
    snippets:
      # Keep Bluefin's kernel and external modules matched. NVIDIA userspace
      # exclusions follow ublue-os/akmods build_files/nvidia/download-nvidia-rpms.sh.
      # Container tooling, GPU firmware, kernel-tools, and kernel-headers can update.
      - |
        set -eu
        dnf5 --refresh --assumeyes \
          --exclude='kernel,kernel-core,kernel-modules*,kernel-devel*' \
          --exclude='kmod-nvidia*,akmod-nvidia*,kmod-v4l2loopback*,akmod-v4l2loopback*,v4l2loopback' \
          --exclude='nvidia-driver*,nvidia-kmod-common,nvidia-libXNVCtrl,nvidia-modprobe,nvidia-persistenced,nvidia-settings,nvidia-xconfig,xorg-x11-nvidia' \
          --exclude='libnvidia-cfg,libnvidia-fbc,libnvidia-gpucomp,libnvidia-ml' \
          --exclude='kmod-zfs*,akmod-zfs*,zfs,zfs-libs,libnvpair*,libuutil*,libzfs*,libzpool*' \
          upgrade
        dnf5 clean all
