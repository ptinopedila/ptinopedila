# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Common CLI/server layer
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - lm_sensors
        - smartmontools
  # Handle inherited Bluefin configuration that is incompatible with this image
  - type: script
    scripts:
      - reset-brew-preinstall.sh
      - remove-inherited-ujust-recipes.sh
      - assert-inherited-ujust-completion.sh

  # Shared workstation configuration
  - type: files
    files:
      - source: shared
        destination: /

  # At equal import depth, Just selects the first matching recipe. Give the
  # shared VM and developer recipes precedence over the archived base's system.just.
  - type: script
    snippets:
      - |
        set -eu
        entry=/usr/share/ublue-os/just/00-entry.just
        line='import "/usr/share/ptinopedila/vms.just"'
        grep -Fxq "$line" "$entry" || sed -i "1i $line" "$entry"
        line='import "/usr/share/ptinopedila/developer.just"'
        grep -Fxq "$line" "$entry" || sed -i "1i $line" "$entry"
        just --justfile "$entry" --show devmode | grep -Fxq '    @/usr/libexec/ptinopedila/developer-tools'
        just --justfile "$entry" --show toggle-devmode | grep -Fxq 'toggle-devmode: devmode'
        for recipe in setup-vms toggle-vms; do
          just --justfile "$entry" --show "$recipe" | grep -F '/usr/libexec/ptinopedila/manage-vm-flatpaks'
        done

  # Redirect inherited user-facing support links to the downstream project.
  - type: script
    scripts:
      - configure-support-surfaces.sh

  # Verify the inherited Bluefin Homebrew installer is still available
  - type: script
    scripts:
      - validate-zsh.sh
      - assert-brew-preinstall.sh
      - enable-brew-preinstall.sh
      - enable-flatpak-preinstall.sh

  # Desktop RPM layer
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - ddccontrol-gtk
        - file-roller-nautilus
        - google-carlito-fonts
        # Word lookup popup and comment-preserving Raffi configuration.
        - zenity
        - python3-ruamel-yaml
        - xdg-terminal-exec
        - wl-clipboard

  # Record the native Flatpak preinstall list for package-audit.
  - type: script
    scripts:
      - build-managed-flatpak-list.py
