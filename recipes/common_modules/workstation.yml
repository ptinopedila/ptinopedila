# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Common CLI/server layer
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - lm_sensors
        - smartmontools
  # Handle inherited Bluefin configuration that is incompatible with this image
  - type: script
    scripts:
      - reset-brew-preinstall.sh
      - remove-inherited-ujust-recipes.sh
      - assert-inherited-ujust-completion.sh

  # Shared workstation configuration
  - type: files
    files:
      - source: shared
        destination: /

  # Redirect inherited user-facing support links to the downstream project.
  - type: script
    scripts:
      - configure-support-surfaces.sh

  # Verify the inherited Bluefin Homebrew installer is still available
  - type: script
    scripts:
      - validate-zsh.sh
      - assert-brew-preinstall.sh
      - enable-brew-preinstall.sh
      - enable-flatpak-preinstall.sh

  # Desktop RPM layer
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - ddccontrol-gtk
        - file-roller-nautilus
        - google-carlito-fonts
        # Word lookup popup and comment-preserving Raffi configuration.
        - zenity
        - python3-ruamel-yaml
        - xdg-terminal-exec
        - wl-clipboard

  # Record the native Flatpak preinstall list for package-audit.
  - type: script
    scripts:
      - build-managed-flatpak-list.py
