# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - quadratech188/vicinae
    install:
      install-weak-deps: false
      packages:
        - bat
        - fd-find
        - hddtemp
        - jq
        - lm_sensors
        - lsd
        - neovim
        - openssh
        - procinfo
        - procs # A modern replacement for ps
        - pv # A tool for monitoring the progress of data through a pipeline.
        - vicinae
        - zsh
        - zsh-autosuggestions
        - smartmontools
        - util-linux-user
        # - mailcap tree-sitter-cli wl-clipboard xdg-utils xsel # neovim weak deps: 13M (+ 27M =40M )

  - type: script
    scripts:
      # this sets up the proper policy & signing files for signed images to work
      - zsh-install.sh

  - type: files
    files:
      - source: shared
        destination: /
