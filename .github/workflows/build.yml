name: bluebuild
on:
  schedule:
    - cron: "00 8 * * sun" # 08:00 UTC every Sunday (4 hours after last bluefin images start building)

  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch: # allow manually triggering builds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Check shell syntax
        run: |
          bash -n files/scripts/*.sh files/scripts/secureblue/*.sh tests/*.sh
          find files/shared/usr/libexec/ptinopedila \
            -maxdepth 1 -type f ! -name package-audit \
            -exec bash -n {} +

      - name: Check just formatting
        run: just --fmt --check --unstable --justfile files/shared/usr/share/ublue-os/just/60-custom.just

      - name: Check text files
        run: tests/check-text-files.sh

      - name: Test custom helpers
        run: |
          tests/install-dotfiles.sh
          tests/install-conda.sh
          tests/check-optim-upstream.sh
          tests/install-dynare.sh
          tests/octave-integration.sh
          tests/install-languagetool.sh
          tests/configure-latex.sh
          tests/remove-inherited-ujust-recipes.sh
          tests/build-managed-flatpak-list.sh
          python3 tests/package-audit.py

  bluebuild:
    name: Build Custom Image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - ptinopedila-home-nvidia.yml
          - ptinopedila-home.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: 'true'
          retry_push_count: '3'

  optim-upstream-check:
    name: Check whether optim still needs C++20
    needs: bluebuild
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check whether this is the first scheduled build of the month
        id: monthly
        run: |
          if (( 10#$(date -u +%d) <= 7 )); then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.monthly.outputs.due == 'true'
        uses: actions/checkout@v7

      - name: Install Octave
        if: steps.monthly.outputs.due == 'true'
        run: /home/linuxbrew/.linuxbrew/bin/brew install octave

      - name: Test optim without the workaround
        if: steps.monthly.outputs.due == 'true'
        id: optim
        run: files/scripts/check-optim-upstream.sh

      - name: Open an issue when upstream is fixed
        if: steps.optim.outputs.fixed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Remove the optim C++20 compatibility workaround
        run: |
          existing_issue=$(gh issue list \
            --state all \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number")

          if [[ -n $existing_issue ]]; then
            echo "Issue #$existing_issue already records the upstream fix."
            exit 0
          fi

          gh issue create \
            --title "$ISSUE_TITLE" \
            --body "The monthly post-build check installed optim and ran nonlin_min without setting CXXFLAGS. The upstream workaround is no longer needed on the tested Homebrew Octave stack.

          Review and remove the fallback from files/shared/usr/libexec/ptinopedila/install-dynare.

          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
