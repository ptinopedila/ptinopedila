[Service]
# Homebrew's Linux bundle checker loads casks before Brewfile trust options are
# applied. Trust this image-managed tap before brew-preinstall evaluates them.
ExecStartPre=/var/home/linuxbrew/.linuxbrew/bin/brew trust --tap ublue-os/tap
ExecStartPre=/var/home/linuxbrew/.linuxbrew/bin/brew trust --tap frostyard/tap
